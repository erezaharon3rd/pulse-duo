# תצוגה מקדימה בדפדפן הטלפון, מחוברת לשרת האמיתי ב-Supabase.
# האפליקציה האמיתית (רטט, ביומטריה, התראות) נבנית ב-EAS ומותקנת בטלפון.
[build]
  base = "/"
  command = "npm install && npm test && npm run build:web"
  publish = "apps/mobile/dist"

[build.environment]
  NODE_VERSION = "22"
  # ערכים ציבוריים (מפתח publishable – מוגן ב-RLS). מפתח השירות לעולם לא כאן.
  EXPO_PUBLIC_SUPABASE_URL = "https://vdecewxjvbdvqjrilumh.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_WkM2DN-EdM1hrOqjf7LTdw_GDp4oFo7"

# ניתוב של אפליקציית עמוד-יחיד
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
